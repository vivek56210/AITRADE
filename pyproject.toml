[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atis"
version = "0.1.0"
description = "ATIS - market/volume-profile playbook for NIFTY and BANKNIFTY index options"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
atis-playbook = "atis.playbook.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["atis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
